defaults:
  - base
  - override dataset: cityscapes
  - _self_

# Evaluation settings
eval:
  task: "seg"
  model_ckpt: null
  # Also train the upsampler with the probe (depth probing)
  supervise_model: false
  # Run the frozen backbone, the upsampler and the probe under bf16 autocast (faster, slightly different numbers)
  use_bf16: false
  # Also validate every N epochs (TensorBoard curves); null validates only after the last epoch
  val_every: null

num_epochs: 20
# Seeds the probe initialization and the training flips
seed: 0
# cuDNN autotuning: ~10% faster training, ~2x the peak GPU memory (3.7 -> 8.2 GB for VOC at 448)
cudnn_benchmark: false

optimizer:
  lr: 5e-4

train_dataloader:
  batch_size: 2

val_dataloader:
  batch_size: 1

img_size: 448
target_size: ${img_size}

# Metrics settings
metrics:
  seg:
    num_classes: ${dataset.num_classes}
  depth:
    min_depth: 0.001
    max_depth: 10

sanity: false
